<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creează un cont Educheia pentru a comenta episoadele și a-ți gestiona experiența pe platformă.">
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
    <meta name="author" content="Educheia">
    <meta name="theme-color" content="#0f1524">
    <meta name="format-detection" content="telephone=no">
    <link rel="canonical" href="https://educheia.md/register">
    <title>Înregistrare Educheia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/register.css">
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
</head>

<body data-theme="dark">
    <nav class="site-header">
        <div class="header-left">
            <a href="/" class="logo-link">
                <picture>
                    <source srcset="../images/logo-dark.webp" media="(prefers-color-scheme: light)">
                    <source srcset="../images/logo-light.webp" media="(prefers-color-scheme: dark)">
                    <img id="header-logo" src="../images/logo-light.webp" alt="Educheia Logo">
                </picture>
            </a>

            <button class="menu-toggle" type="button" aria-expanded="false" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <div id="header-drawer" class="header-drawer">
            <ul id="header-items" class="header-items">
                <li><a href="/" class="header-item">Acasă</a></li>
                <li><a href="/episodes" class="header-item">Toate Episoadele</a></li>
                <li><a href="/about" class="header-item">Despre</a></li>
            </ul>

            <div id="header-btns" class="header-btns auth-pending">
                <a href="/login" id="login-btn">Login</a>
                <a href="/register" id="signup-btn">Signup</a>
            </div>
        </div>

        <div class="header-overlay" aria-hidden="true"></div>
    </nav>

    <main>
        <section class="main-login-box">
            <form class="register-form" action="#" method="post">
                <h1 class="text-2xl font-bold text-center mb-6">Sign Up</h1>

                <label for="username" class="block text-sm font-medium text-text-secondary mb-1">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>

                <label for="email" class="block text-sm font-medium text-text-secondary mb-1">Adresa de email</label>
                <input id="email" name="email" type="email" autocomplete="email" required>

                <label for="password" class="block text-sm font-medium text-text-secondary mb-1">Parola</label>
                <input id="password" name="password" type="password" autocomplete="new-password" required>

                <label for="confirm" class="block text-sm font-medium text-text-secondary mb-1">Confirmă Parola</label>
                <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>

                <button type="submit" class="btn btn-primary w-full">Sign Up</button>

                <div class="my-4 text-center text-text-secondary">or</div>

                <button type="button" class="btn-google">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512" fill="currentColor" aria-hidden="true" focusable="false"><path d="M488 261.8c0-17.4-1.4-34.1-4-50.3H249v95.2h134.9c-5.8 31.7-23.4 58.6-49.8 76.5v63.6h80.6c47.4-43.7 75.3-108 75.3-184.9zM249 511c67.2 0 123.8-22.2 165.1-60.4l-80.6-63.6c-22.4 15-51 23.9-84.5 23.9-64.9 0-120-43.8-139.7-102.6h-82.9v64.4C62.9 456.9 149.4 511 249 511zM109.3 303.3c-4.8-14.4-7.6-29.7-7.6-45.3s2.8-30.9 7.6-45.3v-64.4h-82.9C14.6 199.4 0 225.5 0 259.9s14.6 60.5 36.4 85.3l82.9-64.4zM249 101.5c35.8 0 68 12.3 93.3 36.4l69.9-69.9C371.7 24.6 315.1 0 249 0 149.4 0 62.9 54.1 36.4 135.4l82.9 64.4c19.7-58.8 74.8-102.6 139.7-102.6z"/></svg>
                    Sign up with Google
                </button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-bottom">
                <p class="footer-copy">&copy; 2026 Educheia. Toate drepturile rezervate.</p>
            </div>
        </div>
    </footer>

    <script src="../js/script.js"></script>
    <script type="module" src="../js/account-nav.js"></script>
    <!-- Firebase registration -->
    <script type="module" src="../js/register.js"></script>
</body>

</html>
